- hosts: "{{ lab }}"
  gather_facts: False
  ignore_unreachable: yes
  remote_user: '{{ user_real  }}'
  #become: true
  vars_files:
    - linux_pass_file
    
  vars:
    lab: lab1
    ansible_become_password: '{{  senha_real  }}'
    ansible_ssh_user: '{{ user_real  }}'
    ansible_ssh_private_key_file: id_rsa
    
  tasks:
    - name: Copy config file
      ansible.builtin.copy:
        src: aluno-veyon-config.json
        dest: /home/alunoinfo/aluno-veyon-config.json
        owner: alunoinfo
        group: alunoinfo
        mode: '0644'
    
    - name: Copy public  key
      ansible.builtin.copy:
        src: professor_public_key.pem
        dest: /home/alunoinfo/professor_public_key.pem
        owner: alunoinfo
        group: alunoinfo
        mode: '0644'
    
    - name: Import config file
      command: veyon-cli config import /home/alunoinfo/aluno-veyon-config.json
    
#    - name: Import public key
#      command: veyon-cli authkeys import professor/public /home/alunoinfo/professor_public_key.pem
      
    - name: Remove config file
      ansible.builtin.file:
        path: /home/alunoinfo/aluno-veyon-config.json
        state: absent
    
    - name: Remove public key file
      ansible.builtin.file:
        path: /home/alunoinfo/professor_public_key.pem
        state: absent
    
    - name: Execute systemctl 
      ansible.builtin.shell: systemctl enable veyon.service
      
    - name: Copy custom.conf file
      ansible.builtin.copy:
        src: custom.conf
        dest: /etc/gdm3/custom.conf
        owner: root
        group: root
        mode: '0644'

    - name: Change veyon master shortcut permissions
      ansible.builtin.file:
        path: /usr/share/applications/veyon-master.desktop 
        mode: '0640'
        
    - name: Change veyon configurator shortcut permissions
      ansible.builtin.file:
        path: /usr/share/applications/veyon-configurator.desktop 
        mode: '0640'
        
    - name: Desligando a maquina linux
      command: /sbin/shutdown -h now
